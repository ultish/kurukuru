# Frozen definition-of-done for {{ID}}. The verifier reads this and checks every
# acceptance criterion against CONCRETE EVIDENCE. Set frozen: true at status ready.
slice: "{{ID}}"
title: "{{TITLE}}"
frozen: false

done_definition: >
  REPLACE: one or two sentences stating what is unambiguously true when this
  slice is done. No hedging.

acceptance_criteria:
  - id: AC-1
    statement: "REPLACE: a concrete, observable fact (e.g. POST /things returns 201 with the created id)."
    kind: automated            # automated | manual | observed
    evidence_required: "REPLACE: the exact proof the verifier must obtain, by a method OBTAINABLE IN THIS ENVIRONMENT (run `kuru env <id>` and honor its verification_access). e.g. 'test test_create_thing_201 passes'; or 'exec into the app pod and query in-cluster mongo for the row' — NOT an external connection when the dependency is in-cluster only."
    # Optional `built_by:` — use ONLY when this AC re-verifies a behavior an EARLIER,
    # already-DONE slice built (a regression check after this slice touches its area), so
    # the pre-build critic counts it as already-built, not built-by-nobody. Name that
    # slice:  built_by: SL-0003.  Do NOT tag this slice's OWN new behavior with built_by —
    # that's "built-here" (leave it off). A forward dependency on a not-yet-done slice is
    # expressed with `--depends-on` at new-slice time, NEVER with built_by.
  # - id: AC-2
  #   statement: "..."
  #   kind: observed
  #   evidence_required: "..."

# Gates are not declared per-slice: `kuru gate` runs the gates from .kuru/config.json,
# and all required ones must be green before this slice can become verified. In a
# multi-app repo that's this slice's target's gates (set via `--target`), run in the
# target's dir; a single-app repo just runs its one flat gate set.

out_of_scope:
  - "REPLACE: things explicitly NOT in this slice, so the verifier doesn't fail it for them."
